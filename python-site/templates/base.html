<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · {% endif %}{{ site_name }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="{{ site_name }} home">⚽ <span>{{ site_name }}</span></a>
    <nav aria-label="Main navigation"><a href="#features">Features</a><a href="#about">About</a></nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><p>{{ site_name }} · Statistical analysis for informational purposes only.</p></footer>
  <script src="/assets/js/site.js" defer></script>
</body>
</html>
